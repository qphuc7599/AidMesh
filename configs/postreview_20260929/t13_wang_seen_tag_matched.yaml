schema_version: 1.0.0
registry_id: T13_WANG_SEENTAG_MATCHED_20260929
freeze_status: FROZEN
claims:
  primary_questions: [RQ1]
  decision_rules:
    - Report all registered completion and duplicate-exposure contrasts, including null, negative and boundary results.
    - Treat the 6-hour synchronized seen-tag policy as primary because it matches the manuscript's existing periodic-authorization interval; report 1-hour and 24-hour synchronization as sensitivity bounds.
    - Interpret completion and duplicate exposure jointly; no policy is declared superior from completion alone.
    - The seen-tag policies are author-built Wang-style multi-site instantiations, not the original authors' implementation; the source paper does not prescribe a synchronization transport or frequency.
    - Synchronization is unavailable before the configured partition ends. At each later epoch, all locally seen 32-byte tags are merged before the next request; releases before a merge are irreversible.
    - Tag payload counts are lower bounds that exclude framing, signatures, acknowledgements and audit records; they are not used to alter authorization outcomes.
    - Use fresh seeds disjoint from the reference, holdout and other registered campaigns. Failed cells remain in the denominator.
approval:
  owner: AidMesh research team; local prospective supplemental design authorized before execution
  date_utc: '2026-09-29'
  meaningful_effect_statement: >-
    The primary paired estimands are AidMesh transferable rights minus the 6-hour
    synchronized seen-tag reconstruction in deadline completion and duplicate exposure.
    A 0.05 absolute completion difference is operationally material; any duplicate-exposure
    difference is reported in value units without converting it into a common utility score.
    No universal dominance claim is permitted when the endpoints disagree.
