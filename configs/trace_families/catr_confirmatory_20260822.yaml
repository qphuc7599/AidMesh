  - recovery_timing
hypotheses:
  h1_stable_noninferiority:
    estimand: family-balanced paired completion-rate delta, CATR minus optimized-static
    subset: demand_drift equals stable
    margin: -0.01
    success: lower simultaneous 95 percent confidence bound exceeds margin
  h2_shifting_superiority:
    estimand: family-balanced paired completion-rate delta, CATR minus optimized-static
    subset: demand_drift equals shifting
    margin: 0.0
    success: lower simultaneous 95 percent confidence bound exceeds margin
  h3_stranding_reduction:
    estimand: aggregate final locked rights, CATR divided by AdaTransfer
    success: ratio at most 0.25
  h4_safety:
    estimand: risk cap violations and rights conservation failures
    success: zero violations and zero failures for every rights policy row
analysis:
  alpha: 0.05
  bootstrap_repetitions: 5000
  bootstrap_unit: wildfire incident, retaining all seeds and factorial cells
  multiple_comparisons: Holm correction over h1 through h3
  regime_classes:
    harmful: paired completion delta below -0.01
    neutral: absolute paired completion delta at most 0.01
    beneficial: paired completion delta above 0.01
  exclusions: none after campaign start
