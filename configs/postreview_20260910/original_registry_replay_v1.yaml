schema_version: 1.0.0
registry_id: POSTREVIEW_ORIGINAL_REPLAY_20260910
freeze_status: FROZEN
claims:
  primary_questions:
  - RQ1
  - RQ2
  decision_rules:
  - Report every registered comparison, including negative and boundary results.
  - Reject any run with a manifest or event-schema validation failure.
  - Do not infer external validity beyond the registered scenario families and traces.
  - A completion claim requires the Holm-adjusted p-value below 0.05 AND the paired BCa lower bound above
    the meaningful-effect margin of +0.05 completion.
  - Any honest-site exposure above the registered cap, conflicting safe-domain quorum certificate, or
    risk-conservation failure invalidates the affected claim regardless of averages.
  - CONF_WIT_06 and CONF_PART_60H are registered boundary scenarios; their results are reported as failure-envelope
    evidence, not suppressed.
  - RQ5 (P1 Groth16/EVM parity and cost) and RQ6 (privacy batching Pareto) are executed by their registered
    stand-alone benches; the simulator matrix carries RQ1/RQ2. RQ6 privacy batching is computed over this
    registry's CONF_CORE_W08_P24 raw event logs with the pre-registered 8h/2048B/hide-all profile and
    dummy_min_batch=32.
  - 'RQ2 frontier hypervolume: per-seed 2-D hypervolume over the cap grid {100,200,400,800} with exposure
    normalized by 800 and reference point (exposure=1, completion=0), compared pairwise between transferable
    and static placement per quorum family.'
  - This post-review campaign preserves every original scenario, method, seed count, comparison, endpoint,
    practical margin and multiplicity rule.
  - The replay is a reproducibility check and cannot become a new holdout; the second registry uses disjoint
    Monte Carlo seeds and is opened once after local freeze.
  - Raw negative, null, failed and boundary cells remain in coverage and analysis.
approval:
  owner: T.-D. Tran; local prospective specification before execution
  date_utc: '2026-09-10'
  meaningful_effect_statement: 'For RQ1, the smallest practically meaningful effect is a +0.05 absolute
    increase in paired deadline-completion rate versus the online-only baseline at an unchanged registered
    risk cap; intervals whose lower bound is below +0.05 are reported as inconclusive-or-negative. For
    RQ2, transferable placement is meaningfully better than static placement only if the paired frontier-hypervolume
    difference over the registered cap grid has a 95% BCa lower bound above zero and no conservation or
    cap violation occurs. Safety endpoints (conflicting certificates, exposure above cap) have no averaging:
    a single violation falsifies the associated claim.'
