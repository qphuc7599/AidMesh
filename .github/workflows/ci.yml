name: source and evidence checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the research package
        run: python -m pip install -e ".[dev,crypto,evm]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned circuit-input and native BLS dependencies
        run: |
          npm ci
          python -m pip install -r reproducibility/requirements-aggregate-benchmark.txt
      - name: Compile Python sources
        run: python -m compileall -q aidmesh scripts formal tests
      - name: Run portable unit tests
        run: python -m pytest -q tests/unit
      - name: Check final aggregate evidence
        run: python scripts/check-published-evidence.py
