name: source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the research package
        run: python -m pip install -e ".[dev,crypto]"
      - name: Compile Python sources
        run: python -m compileall -q aidmesh scripts formal tests
      - name: Run source-only unit tests
        run: python -m pytest -q tests/unit
